; php-fpm for devcloud: foreground, logs to stderr, pool config from php-fpm.d plus the
; project overrides the entrypoint writes to /run/php-runtime/fpm.d.
[global]
pid = /run/php-runtime/php-fpm.pid
error_log = /proc/self/fd/2
log_level = notice
log_limit = 8192
daemonize = no

include = /usr/local/etc/php-fpm/php-fpm.d/*.conf
include = /run/php-runtime/fpm.d/*.conf
