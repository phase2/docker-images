[www]
; The master runs as root (image default); workers run as the image user.
; Both directives are ignored, with a notice, when php-fpm is started as non-root.
user = docker
group = docker

; The web container in the same pod connects to 127.0.0.1:9000.
listen = 9000

pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

; Pod env (MYSQL_*, CACHE_HOST, secrets) must reach Drupal's settings.php.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
ping.path = /ping
access.log = /dev/null

; FPM defaults to 1024M, what deployed sites had under the previous image. Pool values
; beat php.ini, so this is the only setting kept here: the CLI stays unlimited (-1), and projects
; change FPM memory in php-fpm.conf in PHP_OVERRIDES_DIR. Everything else lives in conf.d/90-defaults.ini
; so a project *.ini can override it.
php_value[memory_limit] = 1024M
