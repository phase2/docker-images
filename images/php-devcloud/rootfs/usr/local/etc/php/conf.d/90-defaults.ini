; Defaults for the CLI and FPM (FPM's memory_limit is set by the pool in php-fpm.d/www.conf).
; Projects override these with *.ini files in the directory named by PHP_OVERRIDES_DIR.
[PHP]
memory_limit = -1
max_execution_time = 300
upload_max_filesize = 500M
post_max_size = 500M
max_input_vars = 2000
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
expose_php = Off

[Date]
date.timezone = UTC

[mail function]
; Route mail to a catcher (Mailpit/MailHog); host and port come from the environment.
sendmail_path = "/usr/bin/msmtp -t --host=${MSMTP_HOST} --port=${MSMTP_PORT} --from=docker@cli"

[opcache]
opcache.memory_consumption = 128
