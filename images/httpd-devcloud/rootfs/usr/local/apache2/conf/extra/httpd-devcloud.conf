# httpd-devcloud: the default vhosts on :80 and :443, and the project's override files.
# Included at the end of httpd.conf, after conf/devcloud-runtime.conf defines the ${...} values.
ServerName ${APACHE_SERVERNAME}

# HTTP (default virtual host)
<VirtualHost *:80>
	Include conf/extra/includes/host.conf
	# Project overrides go last: Apache uses the last instance of a directive. The glob makes the
	# include optional for that one file.
	<IfDefine APACHE_OVERRIDES>
		IncludeOptional "${APACHE_OVERRIDES_DIR}/httpd-vhost-overrides.con[f]"
	</IfDefine>
</VirtualHost>

# HTTPS (default virtual host), with docksal/apache's TLS settings
Listen 443
# Strong ciphers only (TLSv1.3 ciphers are configured separately)
SSLCipherSuite HIGH:MEDIUM:!SSLv3:!kRSA
SSLProxyCipherSuite HIGH:MEDIUM:!SSLv3:!kRSA
SSLHonorCipherOrder on
# TLSv1.2 and TLSv1.3 only
SSLProtocol -all +TLSv1.2 +TLSv1.3
SSLProxyProtocol -all +TLSv1.2 +TLSv1.3
SSLSessionCache "shmcb:/usr/local/apache2/logs/ssl_scache(512000)"
SSLSessionCacheTimeout 300

<VirtualHost *:443>
	Include conf/extra/includes/host.conf
	<IfDefine APACHE_OVERRIDES>
		IncludeOptional "${APACHE_OVERRIDES_DIR}/httpd-vhost-overrides.con[f]"
	</IfDefine>

	SSLEngine on
	SSLCertificateFile /usr/local/apache2/conf/server.crt
	SSLCertificateKeyFile /usr/local/apache2/conf/server.key

	<FilesMatch "\.(cgi|shtml|phtml|php)$">
		SSLOptions +StdEnvVars
	</FilesMatch>
</VirtualHost>

# Additional virtual hosts from the project
<IfDefine APACHE_OVERRIDES>
	IncludeOptional "${APACHE_OVERRIDES_DIR}/httpd-vhosts.con[f]"
</IfDefine>
