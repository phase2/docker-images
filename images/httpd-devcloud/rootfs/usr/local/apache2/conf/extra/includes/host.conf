# The default vhost's settings, shared by :80 and :443 (docksal/apache's host.conf).
DocumentRoot "${APACHE_DOCUMENTROOT}"
# index.php for apps that ship no .htaccess DirectoryIndex rule; a folder's index.html wins.
DirectoryIndex index.html index.php

<Directory "${APACHE_DOCUMENTROOT}">
	# Drupal's .htaccess needs both.
	Options FollowSymLinks
	AllowOverride All

	# Basic auth when APACHE_BASIC_AUTH_USER and APACHE_BASIC_AUTH_PASS are set
	<IfDefine BasicAuth>
		AuthType Basic
		AuthName "Authentication Required"
		AuthUserFile /usr/local/apache2/htpasswd
		Require valid-user
	</IfDefine>
	<IfDefine !BasicAuth>
		Require all granted
	</IfDefine>
</Directory>

# PHP goes to FPM over FastCGI. A .php file that does not exist stays with Apache (a 404, or the
# app's .htaccess front controller).
<FilesMatch "\.php$">
	<If "-f %{REQUEST_FILENAME}">
		SetHandler "proxy:fcgi://${APACHE_FCGI_HOST_PORT}"
	</If>
</FilesMatch>
<Proxy "fcgi://${APACHE_FCGI_HOST_PORT}">
	ProxySet connectiontimeout=5 timeout=600
</Proxy>
