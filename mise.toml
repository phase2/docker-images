# Host tools for `make lint` / `make test` and the git hooks, pinned for local and CI alike.
# mise.lock records each tool's per-platform download checksums; CI installs with --locked.
# Docker (with buildx) stays a host prerequisite; hadolint, trivy, actionlint and gitleaks run
# from digest-pinned images (Makefile).
#
#   mise install && lefthook install

[tools]
shellcheck = "0.11.0"
container-structure-test = "1.22.1"
lefthook = "2.2.2"

[settings]
lockfile = true
